[workspace]
resolver = "2"
members = [
    "crates/chat-core",
    "crates/deepseek-pow",
    "crates/provider-chatgpt",
    "crates/provider-deepseek",
    "crates/chat-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Tran Quang Dang <tranquangdang21@gmail.com>"]
repository = "https://github.com/quangdang46/chat-cli"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "blocking",
    "rustls-tls",
] }
parking_lot = "0.12"
rpassword = "7"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
glob = "0.3"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
inventory = "0.3"
thiserror = "2.0"
base64 = "0.22"
sha3 = "0.10"
tempfile = "3"
chat-core = { path = "crates/chat-core" }
deepseek-pow = { path = "crates/deepseek-pow" }
provider-chatgpt = { path = "crates/provider-chatgpt" }
provider-deepseek = { path = "crates/provider-deepseek" }
